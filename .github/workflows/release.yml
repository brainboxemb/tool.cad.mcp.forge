# Thin repository-local Forge CAD MCP release adapter.
# Release parsing, validation, tagging and GitHub Release publication are owned
# by modules/release in this repository.

name: Publish MCP release

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  release:
    if: >-
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      checks: read

    steps:
      - name: Check out stable MCP source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Publish exact stable release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/release/src
        run: >-
          python -m forge_mcp_release
          --repository "${{ github.repository }}"
          --command "${{ github.event.comment.body }}"
          --actor "${{ github.actor }}"
          --owner "${{ github.repository_owner }}"
          --issue-number "${{ github.event.issue.number }}"
          --source-root .
