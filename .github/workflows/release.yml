# Repository-local Forge CAD MCP release adapter.
# Release parsing, validation, exact-main preflight, tagging and GitHub Release
# publication are owned by modules/release in this repository. Full released-
# stack CAD acceptance is owned by this workflow immediately before publication.

name: Publish MCP release

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  release:
    if: >-
      !github.event.issue.pull_request &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      checks: read

    steps:
      - name: Check out stable MCP source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate exact release request
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/release/src
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMAND: ${{ github.event.comment.body }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_ISSUE: ${{ github.event.issue.number }}
        run: |
          python -m forge_mcp_release \
            --check-only \
            --repository "$RELEASE_REPOSITORY" \
            --command "$RELEASE_COMMAND" \
            --actor "$RELEASE_ACTOR" \
            --owner "$RELEASE_OWNER" \
            --issue-number "$RELEASE_ISSUE" \
            --source-root .

      - name: Check out qualified Forge release
        uses: actions/checkout@v7
        with:
          repository: brainboxemb/lib.py.solidcraft.forge
          ref: v0.25.0
          path: forge-release
          persist-credentials: false

      - name: Install release acceptance dependencies
        run: python -m pip install . ./forge-release/cadlib

      - name: Test exact released SolidCraft stack
        env:
          FORGE_SOURCE_ROOT: ${{ github.workspace }}/forge-release
        run: bash scripts/run_released_stack_acceptance.sh

      - name: Publish exact stable release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: modules/release/src
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMAND: ${{ github.event.comment.body }}
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_ISSUE: ${{ github.event.issue.number }}
        run: |
          python -m forge_mcp_release \
            --repository "$RELEASE_REPOSITORY" \
            --command "$RELEASE_COMMAND" \
            --actor "$RELEASE_ACTOR" \
            --owner "$RELEASE_OWNER" \
            --issue-number "$RELEASE_ISSUE" \
            --source-root .
