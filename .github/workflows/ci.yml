name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test installed MCP package
        if: hashFiles('pyproject.toml') != ''
        run: |
          python -m pip install '.[test]'
          python -m pytest -q tests
      - name: Test shared merge and cleanup policy
        run: |
          python -m pip install PyYAML==6.0.2
          PYTHONPATH=modules/merge-policy/src python -m unittest discover -s modules/merge-policy/tests
          PYTHONPATH=modules/branch-cleanup/src python -m unittest discover -s modules/branch-cleanup/tests
