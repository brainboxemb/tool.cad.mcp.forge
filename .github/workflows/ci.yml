name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out MCP source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Classify released-stack acceptance
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/ci_scope.py
          --event "$CI_EVENT_NAME"
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Test repository policy modules
        run: |
          python -m pip install PyYAML==6.0.2
          PYTHONPATH=modules/merge-policy/src python -m unittest discover -s modules/merge-policy/tests
          PYTHONPATH=modules/branch-cleanup/src python -m unittest discover -s modules/branch-cleanup/tests
          PYTHONPATH=modules/release/src python -m unittest discover -s modules/release/tests

      - name: Check out qualified Forge release
        uses: actions/checkout@v7
        with:
          repository: brainboxemb/lib.py.solidcraft.forge
          ref: v0.25.0
          path: forge-release
          persist-credentials: false

      - name: Install and test MCP package
        env:
          FORGE_SOURCE_ROOT: ${{ github.workspace }}/forge-release
        run: |
          python -m pip install '.[test]' ./forge-release/cadlib
          python -m pytest -q tests

      - name: Test released SolidCraft stack
        if: steps.scope.outputs.runtime == 'true'
        env:
          FORGE_SOURCE_ROOT: ${{ github.workspace }}/forge-release
        run: bash scripts/run_released_stack_acceptance.sh
